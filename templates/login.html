<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ورود مدیر</title>
    <style>
        body {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            font-family: 'Tahoma', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            width: 350px;
        }

        h2 { color: #007bff; margin-bottom: 20px; }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: 'Tahoma';
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: #007bff; }

        button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        button:hover { background: #0056b3; }

        a { display: block; margin-top: 15px; color: #888; text-decoration: none; font-size: 14px; }
        a:hover { color: #555; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>🔐 ورود به پنل</h2>
        <form method="post">
            <input type="password" name="password" placeholder="رمز عبور را وارد کنید..." required>
            <button type="submit">ورود</button>
        </form>
        <a href="/">← بازگشت به صفحه اصلی</a>
    </div>
</body>
</html>
