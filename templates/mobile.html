<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>کیف پول همراه</title>
    <style>
        body { background-color: #121212; color: #fff; font-family: 'Tahoma', sans-serif; margin: 0; padding: 15px; text-align: center; }
        .header { border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        h2 { color: #00bcd4; margin: 0; }
        p { font-size: 12px; color: #777; }
        
        /* تب‌ها */
        .tabs { display: flex; justify-content: center; margin-bottom: 20px; background: #2c2c2c; border-radius: 10px; padding: 5px; }
        .tab { flex: 1; padding: 10px; cursor: pointer; border-radius: 8px; font-size: 14px; transition: 0.3s; }
        .tab.active { background: #00bcd4; color: black; font-weight: bold; }
        
        .content-box { display: none; }
        .show { display: block; }

        /* ورودی‌ها */
        input, select {
            width: 100%; padding: 15px; background: #2c2c2c; color: white;
            border: 1px solid #444; border-radius: 10px; font-size: 16px;
            margin-bottom: 15px; box-sizing: border-box; text-align: center; outline: none;
        }
        
        /* دکمه پرداخت */
        .btn-pay {
            width: 100%; padding: 15px; background: linear-gradient(45deg, #00e676, #00bfa5);
            color: black; border: none; border-radius: 50px; font-size: 18px; font-weight: bold;
            cursor: pointer; box-shadow: 0 0 10px rgba(0, 230, 118, 0.4); margin-top: 10px;
        }
        
        /* لیست قیمت */
        .quick-amounts { display: flex; gap: 10px; margin-bottom: 20px; }
        .q-btn { flex: 1; background: #333; color: white; border: 1px solid #555; padding: 10px; border-radius: 8px; }

        /* پیغام خطا/موفقیت */
        .alert { padding: 10px; border-radius: 5px; margin-bottom: 15px; font-size: 12px; display: none; }
        .err { background: #cf6679; color: white; }
    </style>
</head>
<body>

    <div class="header">
        <h2>UniWallet 📱</h2>
        <p>سیستم مدیریت مالی دانشگاه</p>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="setTab('list')">لیست اسامی</div>
        <div class="tab" onclick="setTab('nfc')">اسکن NFC 📡</div>
    </div>

    <form action="/charge_wallet" method="POST">
        <input type="hidden" name="source" value="mobile">
        
        <div id="list-mode" class="content-box show">
            <label style="color:#aaa; display:block; margin-bottom:5px;">استاد را انتخاب کنید:</label>
            <select name="uid_select" id="uid_select" onchange="syncUid(this.value)">
                <option value="" disabled selected>-- انتخاب کنید --</option>
                {% for u in users %}
                <option value="{{ u.uid }}">{{ u.name }} ({{ u.balance }} تومان)</option>
                {% endfor %}
            </select>
        </div>

        <div id="nfc-mode" class="content-box">
            <div class="alert err" id="nfc-alert">برای اسکن، نرم‌افزار NFC Tools را باز کنید، کد را کپی و اینجا پیست کنید.</div>
            <label style="color:#aaa; display:block; margin-bottom:5px;">کد کارت (UID):</label>
            <input type="text" name="uid_input" id="uid_input" placeholder="کد را اینجا Paste کنید..." oninput="cleanUid(this)">
        </div>

        <input type="hidden" name="uid" id="final_uid">

        <hr style="border-color:#333; margin:20px 0;">

        <label style="color:#aaa; display:block; margin-bottom:5px;">مبلغ شارژ (تومان):</label>
        <input type="number" name="amount" id="amount" placeholder="0">

        <div class="quick-amounts">
            <button type="button" class="q-btn" onclick="document.getElementById('amount').value=50000">50,000</button>
            <button type="button" class="q-btn" onclick="document.getElementById('amount').value=100000">100,000</button>
            <button type="button" class="q-btn" onclick="document.getElementById('amount').value=200000">200,000</button>
        </div>

        <button class="btn-pay" type="button" onclick="prepareSubmit()">افزایش موجودی ⚡</button>
    </form>
    
    <div style="margin-top:30px; border-top:1px solid #333; padding-top:10px;">
        <p>تعداد اساتید: {{ users|length }}</p>
    </div>

    <script>
        let currentMode = 'list';

        function setTab(mode) {
            currentMode = mode;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.content-box').forEach(c => c.classList.remove('show'));
            
            if(mode === 'list') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('list-mode').classList.add('show');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('nfc-mode').classList.add('show');
                document.getElementById('nfc-alert').style.display = 'block';
            }
        }

        function syncUid(val) {
            document.getElementById('final_uid').value = val;
        }

        function cleanUid(input) {
            // حذف دو نقطه ها اگر نرم افزار NFC با فرمت AA:BB میدهد
            let val = input.value.replace(/:/g, "").toUpperCase();
            input.value = val;
            document.getElementById('final_uid').value = val;
        }

        function prepareSubmit() {
            // پر کردن UID نهایی بر اساس تب فعال
            if(currentMode === 'nfc') {
                document.getElementById('final_uid').value = document.getElementById('uid_input').value;
            } else {
                document.getElementById('final_uid').value = document.getElementById('uid_select').value;
            }
            
            const uid = document.getElementById('final_uid').value;
            const amount = document.getElementById('amount').value;

            if(!uid) {
                alert("لطفا کاربر یا کد کارت را مشخص کنید!");
                return;
            }
            if(!amount || amount == 0) {
                 alert("لطفا مبلغ را وارد کنید!");
                 return;
            }
            
            // اگر همه چیز درست بود، فرم را بفرست
            document.querySelector('form').submit();
        }
    </script>
</body>
</html>
